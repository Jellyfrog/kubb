name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, zsh]
    steps:
      - uses: actions/checkout@v7

      # kubectl and mikefarah/yq are preinstalled on GitHub-hosted runners
      - name: Install test dependencies
        run: sudo apt update && sudo apt install -y bats zsh

      - name: Run tests (${{ matrix.shell }})
        run: bats tests/
        env:
          KUBB_TEST_SHELL: ${{ matrix.shell }}

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, zsh]
    steps:
      - uses: actions/checkout@v7

      - name: Install kwokctl
        uses: kubernetes-sigs/kwok@v0.8.0
        with:
          command: kwokctl

      # kubectl and mikefarah/yq are preinstalled on GitHub-hosted runners
      - name: Install test dependencies
        run: sudo apt update && sudo apt install -y bats zsh

      - name: Create kwok clusters
        run: tests/integration/setup-kwok.sh

      - name: Run integration tests (${{ matrix.shell }})
        run: bats tests/integration/
        env:
          KUBB_TEST_SHELL: ${{ matrix.shell }}
