name: Generate demo GIF

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kwokctl
        uses: kubernetes-sigs/kwok@main
        with:
          command: kwokctl

      - name: Create clusters
        run: |
          kwokctl create cluster --name=production
          kwokctl create cluster --name=staging

      - name: Create namespaces
        run: |
          kubectl --context kwok-production create namespace monitoring
          kubectl --context kwok-production create namespace app
          kubectl --context kwok-production create namespace ingress
          kubectl --context kwok-staging create namespace monitoring
          kubectl --context kwok-staging create namespace app
          kubectl --context kwok-staging create namespace ingress

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fzf ffmpeg ttyd
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo wget -qO /tmp/vhs.deb https://github.com/charmbracelet/vhs/releases/download/v0.11.0/vhs_0.11.0_amd64.deb
          sudo dpkg -i /tmp/vhs.deb

      - name: Sanity check
        run: |
          source kubb.sh
          kubb ctx production
          kubectl get nodes
          kubb ns app
          kubectl get namespaces

      - name: Generate demo GIF
        run: vhs demo.tape

      - name: Commit GIF
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add demo.gif
          git commit -m "chore: update demo GIF" || exit 0
          git push
